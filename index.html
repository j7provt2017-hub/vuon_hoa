<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#bbdff5">
  <meta name="description" content="Chạm một bông hoa, đánh thức cả khu vườn và nhận một lời chúc dịu dàng ngày 20/10.">
  <title>Cả một vườn thương · 20/10</title>
  <link rel="preload" href="./assets/fonts/noto-serif-regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="./assets/fonts/noto-sans-regular.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face {
      font-family: "Noto Serif";
      src: url("./assets/fonts/noto-serif-regular.woff2") format("woff2");
      font-style: normal; font-weight: 400; font-display: swap;
    }
    @font-face {
      font-family: "Noto Serif";
      src: url("./assets/fonts/noto-serif-italic.woff2") format("woff2");
      font-style: italic; font-weight: 400; font-display: swap;
    }
    @font-face {
      font-family: "Noto Sans";
      src: url("./assets/fonts/noto-sans-regular.woff2") format("woff2");
      font-style: normal; font-weight: 400; font-display: swap;
    }
    :root {
      color-scheme: light;
      --sky: #bbdff5;
      --ink: #703a50;
      --muted: #936779;
      --rose: #c66388;
      --leaf: #6c8b71;
      --paper: #fffdfc;
      --font-letter: "Noto Serif", serif;
      font-family: "Noto Sans", sans-serif;
      color: var(--ink);
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; min-width: 280px; min-height: 100%; }
    body { background: var(--sky); -webkit-tap-highlight-color: transparent; }
    button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
    button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }
    .garden {
      position: relative; min-height: 560px; height: 100svh; overflow: hidden;
      isolation: isolate;
      background: linear-gradient(180deg, #bbdff5 0%, #d8edf9 37%, #edf7fb 70%, #f2f7ec 100%);
    }
    .garden::after {
      content: ""; position: absolute; inset: 0; z-index: -2; pointer-events: none;
      background: radial-gradient(ellipse at 50% 110%, #d7e8caaa, transparent 58%);
      opacity: 0; transition: opacity 4s;
    }
    .garden.is-growing::after { opacity: 1; }
    .page-header {
      position: absolute; top: max(28px, env(safe-area-inset-top));
      left: clamp(24px, 5vw, 76px); right: clamp(24px, 5vw, 76px);
      display: flex; align-items: start; justify-content: space-between; gap: 24px;
      pointer-events: none;
    }
    .dedication { margin: 0; font: italic 20px/1.6 var(--font-letter); }
    .date { margin: 0; text-align: right; font-size: 11px; line-height: 1.7; color: var(--muted); }
.date span { display: block; font: 28px/1.4 var(--font-letter); color: var(--ink); margin-bottom: 5px; }
    #flowers { position: absolute; inset: 0; z-index: -1; width: 100%; height: 100%; }
    .flower-button {
      position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%);
      width: 184px; height: 184px; border: 0; border-radius: 50%; background: transparent;
    }
    .flower-button::after {
      content: ""; position: absolute; inset: 8px; border: 1px solid #d69ab23b; border-radius: 50%;
      transition: transform .5s, border-color .5s;
    }
    .flower-button:hover::after { transform: scale(1.13); border-color: #c6638888; }
    .intro {
      position: absolute; left: 24px; right: 24px; top: 19%; text-align: center;
      transition: opacity .65s, transform .65s; pointer-events: none;
    }
    h1 { margin: 0; font: 400 clamp(25px, 3vw, 35px)/1.5 var(--font-letter); }
    .intro p { margin: 13px 0 0; font-size: 13px; line-height: 1.7; color: var(--muted); }
    .is-growing .intro { opacity: 0; transform: translateY(12px); }
    .progress {
      position: absolute; bottom: 36px; left: 20px; right: 20px; margin: 0;
      text-align: center; font: italic 17px/1.7 var(--font-letter);
      opacity: 0; transition: opacity .6s; pointer-events: none;
      text-shadow: 0 1px 12px #fff, 0 1px 8px #fff;
    }
    .is-growing:not(.is-ready) .progress { opacity: 1; }
    .garden-actions {
      position: absolute; bottom: max(24px, env(safe-area-inset-bottom)); left: 0; right: 0;
      display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; padding: 0 16px;
    }
    .garden-actions button {
      border: 1px solid #dcb9c8; background: #fffdfcf2; border-radius: 30px;
      padding: 12px 20px; font-size: 12px; box-shadow: 0 3px 16px #76364d0c;
    }
    .garden-actions button:hover { background: #fae7ef; }
    dialog {
      width: min(480px, calc(100% - 36px)); max-height: calc(100svh - 36px);
      padding: 0; border: 0; overflow: auto; background: var(--paper); color: var(--ink);
      box-shadow: 0 24px 100px #69394d24, 0 2px 10px #69394d12;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    dialog::-webkit-scrollbar { display: none; }
    dialog::backdrop { background: #eaf5fc3d; backdrop-filter: blur(3px); }
    dialog[open] { animation: unfold 1s cubic-bezier(.2,.8,.2,1) both; }
    .letter { position: relative; padding: 38px 42px 28px; text-align: center; }
    .letter::before { content: ""; position: absolute; inset: 10px; border: 1px solid #eed6e1; pointer-events: none; }
    .close-card { position: absolute; top: 15px; right: 16px; width: 34px; height: 34px; border: 0; background: transparent; font-size: 25px; }
    .letter-date { margin: 2px 0 20px; font: 24px/1.4 var(--font-letter); color: var(--rose); }
    .letter-date span { display: inline-block; width: 1px; height: 27px; background: #d9aec1; transform: rotate(24deg); margin: 0 15px -5px; }
.letter-sprig { display: block; margin: 0 auto 17px; width: 75px; height: 55px; }
    .recipient { font: italic 17px/1.7 var(--font-letter); margin: 0 0 13px; }
    h2 { font: 400 clamp(26px, 5vw, 32px)/1.5 var(--font-letter); margin: 0 0 24px; text-wrap: balance; }
    .message { font-size: 14px; line-height: 1.95; margin: 0 0 15px; text-wrap: pretty; }
    .signature { margin: 24px 0; font: italic 17px/1.8 var(--font-letter); }
    .recipient, h2, .message, .signature { overflow-wrap: anywhere; }
    h2, .message, .signature { white-space: pre-wrap; }
    .letter-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px 20px; }
    .view-garden { position: relative; border: 0; border-bottom: 1px solid #cba1b2; padding: 7px 2px; background: transparent; font-size: 12px; }
    .card-editor { text-align: left; }
    .card-editor h2 { text-align: center; margin-bottom: 20px; font-size: 25px; }
    .card-editor label { display: block; margin: 16px 0 7px; font-size: 13px; }
    .card-editor input, .card-editor textarea {
      display: block; width: 100%; min-width: 0; padding: 10px 12px;
      border: 1px solid #dcb9c8; border-radius: 4px; background: #fff9fb;
      color: var(--ink); font: 16px/1.6 "Noto Sans", sans-serif;
    }
    .card-editor textarea { resize: vertical; }
    .editor-hint, .card-status { color: var(--muted); font-size: 12px; line-height: 1.7; }
    .card-status { margin: 0; }
    .card-status:not(:empty) { margin-top: 16px; }
    .editor-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 20px; margin-top: 20px; }
    .save-card { border: 1px solid var(--ink); border-radius: 24px; padding: 11px 18px; background: var(--ink); color: var(--paper); font-size: 13px; }
    .noscript { position: absolute; top: 30%; left: 20px; right: 20px; text-align: center; line-height: 1.8; }
    @keyframes unfold { from { opacity: 0; transform: translateY(35px) rotate(-2deg) scale(.94); } to { opacity: 1; transform: none; } }
    @media (max-width: 600px) {
      .dedication { font-size: 18px; max-width: 150px; }
      .date { max-width: 130px; font-size: 10px; }
      .date span { font-size: 25px; }
      .letter { padding: 35px 26px 25px; }
      .intro { top: 18%; }
      h1 { font-size: clamp(23px, 5.8vw, 28px); }
    }
    @media (max-height: 600px) and (min-width: 600px) {
      .garden { min-height: 360px; }
      .intro { top: 38%; right: auto; width: 30%; text-align: left; }
      h1 { font-size: 24px; }
      .intro p { margin-top: 6px; }
      .page-header { top: 20px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="garden" id="garden">
    <header class="page-header">
      <p class="dedication">Dành bạn, cả một vườn thương.</p>
      <p class="date"><span>20 / 10</span>Ngày Phụ nữ Việt Nam</p>
    </header><canvas id="flowers" aria-hidden="true"></canvas>
    <button class="flower-button" id="bloom" type="button" aria-label="Chạm để cả vườn hoa nở" aria-describedby="introHint"></button>
    <div class="intro" id="intro">
      <h1>Từ một bông hoa nhỏ…</h1>
      <p id="introHint">Chạm vào hoa, một điều dịu dàng đang chờ bạn.</p>
    </div>
    <p class="progress" id="status" role="status" aria-live="polite" aria-atomic="true"></p>
    <nav class="garden-actions" id="actions" aria-label="Vườn hoa và thiệp" hidden>
      <button id="readCard" type="button" aria-haspopup="dialog" aria-controls="wishCard">Đọc lại thiệp</button>
      <button id="replay" type="button">Cho hoa nở lại</button>
    </nav>
    <dialog id="wishCard" aria-labelledby="cardTitle">
      <article class="letter">
        <button class="close-card" id="closeCard" type="button" aria-label="Đóng thiệp">×</button>
        <p class="letter-date">20<span aria-hidden="true"></span>10</p>
        <svg class="letter-sprig" viewBox="0 0 90 64" fill="none" aria-hidden="true">
          <path d="M45 59 Q41 40 46 21 M44 49 Q25 47 23 35 Q39 33 44 49 M44 40 Q60 39 65 28 Q51 28 44 40" stroke="#78947a" stroke-width="1.2" fill="#dfe9d9"/>
